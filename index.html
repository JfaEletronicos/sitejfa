<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JFA Eletrônicos</title>
    <meta
      name="description"
      content="JFA Eletrônicos: há mais de duas décadas desenvolvendo soluções para energia, movimento e eletrônica."
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap"
    />
    <link rel="preload" href="/fonts/StretchPro.woff" as="font" type="font/woff" crossorigin />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita piscar escuro -> claro).
      try {
        if (localStorage.getItem('jfa-theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
