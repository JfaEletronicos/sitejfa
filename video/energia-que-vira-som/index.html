<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JFA — Energia que vira som</title>
    <style>
      @font-face {
        font-family: 'StretchPro';
        src: url('/fonts/StretchPro.woff') format('woff');
      }
      @font-face {
        font-family: 'Bebas Neue';
        src: url('./fonts/bebas-neue-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: italic;
        src: url('./fonts/playfair-display-latin-400-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 300;
        src: url('./fonts/space-grotesk-latin-300-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Space Grotesk';
        font-weight: 500;
        src: url('./fonts/space-grotesk-latin-500-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        transform-origin: 0 0;
      }
      canvas {
        display: block;
      }
      #end {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
        opacity: 0;
        font-family: 'StretchPro', sans-serif;
      }
      #end .logo {
        font-size: 190px;
        letter-spacing: 0.06em;
      }
      #end .tag {
        margin-top: 36px;
        font-family: system-ui, sans-serif;
        font-weight: 300;
        font-size: 46px;
        letter-spacing: 0.08em;
        color: #cfd8e6;
      }
      #end .tag b {
        font-weight: 500;
        color: #4d95ff;
      }
      #ui {
        position: fixed;
        left: 8px;
        bottom: 8px;
        color: #9ab;
        font: 12px monospace;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="end">
        <div class="logo">JFA</div>
        <div class="tag">Energia que vira <b>som</b>.</div>
      </div>
    </div>
    <div id="ui"></div>
    <script type="module" src="./film.js"></script>
  </body>
</html>
